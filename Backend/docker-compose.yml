services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    command: ["mongod", "--auth"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-shoproot}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-change-this-root-password}
      MONGO_INITDB_DATABASE: cambodia_shop
      SHOP_DB_USERNAME: ${SHOP_DB_USERNAME:-shopapp}
      SHOP_DB_PASSWORD: ${SHOP_DB_PASSWORD:-change-this-app-password}
    volumes:
      - mongo_data:/data/db
      - ./mongo-init.sh:/docker-entrypoint-initdb.d/mongo-init.sh:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--username", "${MONGO_ROOT_USERNAME:-shoproot}", "--password", "${MONGO_ROOT_PASSWORD:-change-this-root-password}", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      MONGODB_URI: mongodb://${SHOP_DB_USERNAME:-shopapp}:${SHOP_DB_PASSWORD:-change-this-app-password}@mongo:27017/cambodia_shop?authSource=cambodia_shop
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      mongo:
        condition: service_healthy
volumes:
  mongo_data:
